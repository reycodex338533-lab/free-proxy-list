name: Desktop Remoto (Guacamole + Cloudflare Tunnel)

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Número da instância (1-10)'
        required: false
        default: '1'
        type: string

jobs:
  deploy-guacamole:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Gerar usuários e senhas aleatórios
        run: |
          rand() { openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c "$1"; }
          GUAC_USER="u$(rand 8)"
          GUAC_PASS="$(rand 20)"
          RDP_USER="r$(rand 8)"
          RDP_PASS="$(rand 20)"
          echo "GUAC_USER=$GUAC_USER" >> "$GITHUB_ENV"
          echo "GUAC_PASS=$GUAC_PASS" >> "$GITHUB_ENV"
          echo "RDP_USER=$RDP_USER" >> "$GITHUB_ENV"
          echo "RDP_PASS=$RDP_PASS" >> "$GITHUB_ENV"

      - name: Instalar XFCE e xRDP
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xfce4 xfce4-goodies xrdp dbus-x11
          sudo adduser xrdp ssl-cert
          sudo useradd -m -s /bin/bash "$RDP_USER"
          echo "${RDP_USER}:${RDP_PASS}" | sudo chpasswd
          sudo adduser "$RDP_USER" sudo
          echo "dbus-run-session -- startxfce4" | sudo tee "/home/${RDP_USER}/.xsession" > /dev/null
          sudo chown "${RDP_USER}:${RDP_USER}" "/home/${RDP_USER}/.xsession"
          sudo systemctl enable --now xrdp
          sudo systemctl restart xrdp
          sudo systemctl status xrdp --no-pager

      - name: Subir Guacamole (guacd + guacamole) via Docker
        run: |
          mkdir -p guac-config
          cat > guac-config/user-mapping.xml <<EOF
          <user-mapping>
            <authorize username="${GUAC_USER}" password="${GUAC_PASS}">
              <connection name="Desktop Linux">
                <protocol>rdp</protocol>
                <param name="hostname">localhost</param>
                <param name="port">3389</param>
                <param name="username">${RDP_USER}</param>
                <param name="password">${RDP_PASS}</param>
                <param name="ignore-cert">true</param>
                <param name="security">any</param>
                <param name="resize-method">display-update</param>
              </connection>
            </authorize>
          </user-mapping>
          EOF

          docker run -d --name guacd --network host guacamole/guacd

          docker run -d --name guacamole --network host \
            -e GUACD_HOSTNAME=localhost \
            -e GUACAMOLE_HOME=/config \
            -v "$PWD/guac-config:/config" \
            guacamole/guacamole

          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/guacamole/ > /dev/null; then
              echo "Guacamole pronto"
              break
            fi
            sleep 3
          done
          curl -fs http://localhost:8080/guacamole/ > /dev/null || { docker logs guacamole; exit 1; }

      - name: Abrir túnel público (Cloudflare)
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          nohup cloudflared tunnel --no-autoupdate --url http://localhost:8080 \
            > "$RUNNER_TEMP/cloudflared.log" 2>&1 &

          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' "$RUNNER_TEMP/cloudflared.log" | head -n1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then cat "$RUNNER_TEMP/cloudflared.log"; exit 1; fi
          echo "GUAC_URL=$URL/guacamole/" >> "$GITHUB_ENV"

      - name: Mostrar credenciais de acesso
        run: |
          echo "=============================================="
          echo " DESKTOP PRONTO - Instância #${{ github.event.inputs.instance_number || '1' }}"
          echo "=============================================="
          echo " Acesso web : $GUAC_URL"
          echo " Usuário    : $GUAC_USER"
          echo " Senha      : $GUAC_PASS"
          echo "----------------------------------------------"
          echo " Após o login, escolha 'Desktop Linux'."
          echo "=============================================="

      - name: Manter sessão ativa
        run: |
          while true; do
            for c in guacd guacamole; do
              docker ps --format '{{.Names}}' | grep -qx "$c" || { echo "Container $c caiu"; docker logs "$c" | tail -n 50; exit 1; }
            done
            pgrep -f cloudflared > /dev/null || { echo "cloudflared caiu"; exit 1; }
            echo "Sessão ativa - $(date) - $GUAC_URL"
            sleep 60
          done
